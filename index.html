<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrack | Driver Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-morphism {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full glass-morphism rounded-2xl p-8 shadow-2xl">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                LogiTrack
            </h1>
            <p class="text-slate-400 text-sm mt-2">Live Vehicle Tracker</p>
        </header>

        <form id="trackingForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Driver Name</label>
                <input type="text" id="driverName" required 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Vehicle Number</label>
                <input type="text" id="vehicleNo" required 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Chassis Number (Optional)</label>
                <input type="text" id="chassisNo" 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>

            <button type="button" id="startBtn" 
                class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-bold py-4 rounded-xl shadow-lg transform active:scale-95 transition-all">
                START TRACKING
            </button>
        </form>

        <div id="statusPanel" class="hidden mt-8 pt-6 border-t border-slate-800">
            <div class="flex items-center justify-between mb-4">
                <span class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-emerald-500 rounded-full status-pulse"></span>
                    <span class="text-sm font-medium">Live Tracking Active</span>
                </span>
                <button id="stopBtn" class="text-red-400 text-xs font-bold hover:underline">STOP</button>
            </div>
            <pre id="jsonOutput" class="bg-black/50 p-4 rounded-lg text-[10px] font-mono text-emerald-400 overflow-x-auto"></pre>
        </div>
    </div>

    <script src="D:\Scheduled task\temp\temp.cts.scripts\app.js"></script>
</body>
</html>
